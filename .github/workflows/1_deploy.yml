name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: ttb-containers/ttb-back-service
  LIGHTSAIL_SERVICE: ttb-back-service
  CONTAINER_APP: ttb-back-service-container
  MONGO_URI: ${{ secrets.MONGO_URI }}
  MONGO_DB: ${{ secrets.MONGO_DB }}
  API_SERVER_PORT: 8080

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
 
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_VPS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
 
      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
 
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Get short-lived AWS credentials from the OIDC session, then forward
      # THOSE to the VPS (instead of a pre-generated ECR password). The VPS
      # calls `aws ecr get-login-password` itself -- avoids forwarding a
      # ~1400+ char token through ssh-action's env mechanism, which can
      # arrive truncated/corrupted and cause "400 Bad Request" on login.
      - name: Configure AWS credentials (OIDC)
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_VPS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          output-credentials: true
          role-duration-seconds: 900   # 6 min -- these creds only need to live long enough for this SSH step
 
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,MONGO_URI,MONGO_DB
          script: |
            set -e
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            cd /home/ubuntu/opt/${{ github.event.repository.name }}   # change to wherever docker-compose.yml lives on the VPS
 
            # write the values docker-compose.yml needs into .env
            cat > .env <<EOF
            ECR_REGISTRY=$ECR_REGISTRY
            ECR_REPOSITORY=$ECR_REPOSITORY
            IMAGE_TAG=$IMAGE_TAG
            MONGO_URI=$MONGO_URI
            MONGO_DB=$MONGO_DB
            EOF
 
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f